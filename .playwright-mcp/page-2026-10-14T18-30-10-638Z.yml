              - generic [ref=e55]:
                - term [ref=e56]: Scope
                - definition [ref=e57]: UX strategy, information architecture, UX writing, design system, development
              - generic [ref=e58]:
                - term [ref=e59]: Platform
                - definition [ref=e60]: iOS and Android, React Native
              - generic [ref=e61]:
                - term [ref=e62]: Audience
                - definition [ref=e63]: Vietnamese Gen Z students and young professionals
              - generic [ref=e64]:
