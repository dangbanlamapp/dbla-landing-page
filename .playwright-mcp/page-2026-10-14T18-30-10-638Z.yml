          - heading "Overview" [level=2] [ref=e47]
          - generic [ref=e48]:
            - paragraph [ref=e49]: Making a room full of strangers feel like a team
            - paragraph [ref=e50]: A focus, community and loyalty app for RU:TINE, a Vietnamese working-café brand. We led it from strategy to handoff, shipped it in mid-2026, then used what launch taught us to reshape it into a multi-brand platform.
